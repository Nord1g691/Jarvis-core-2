<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020812">
<title>JARVIS Core 2</title>
<style>
:root{--cyan:#00eaff;--blue:#008cff;--green:#39ff88;--violet:#b14aff;--orange:#ffb000;--red:#ff3158;--bg:#01050c;--text:#d9faff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow-x:hidden}body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:10px;background:radial-gradient(circle at 50% 38%,rgba(0,180,255,.12),transparent 52%),#01050c}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,220,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,255,.018) 1px,transparent 1px);background-size:32px 32px}.app{width:100%;max-width:1050px;display:flex;flex-direction:column;align-items:center}.header{text-align:center;padding-top:5px}.logo{font-size:clamp(26px,6vw,42px);letter-spacing:12px;font-weight:700;text-shadow:0 0 8px var(--cyan),0 0 25px rgba(0,234,255,.65)}.subtitle{margin-top:4px;color:rgba(140,220,255,.7);letter-spacing:4px;font-size:9px;text-transform:uppercase}.status{margin-top:8px;display:inline-flex;gap:7px;align-items:center;padding:4px 12px;border:1px solid rgba(0,234,255,.28);border-radius:20px;background:rgba(0,20,35,.45);font-size:10px;letter-spacing:2px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.coreZone{width:min(94vw,650px);height:min(94vw,650px);position:relative;display:flex;align-items:center;justify-content:center}.core{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,transparent,rgba(0,234,255,.12) 18deg,transparent 46deg);animation:rot 5.5s linear infinite}.bars{position:absolute;inset:0;border-radius:50%;pointer-events:none}.bar{position:absolute;width:2px;height:26px;left:50%;top:50%;margin:-13px 0 0 -1px;transform-origin:center;background:linear-gradient(to bottom,rgba(0,234,255,.12),var(--cyan),rgba(0,140,255,.12));box-shadow:0 0 5px rgba(0,234,255,.8),0 0 12px rgba(0,234,255,.25);opacity:.55}.bar:nth-child(3n){opacity:.3}.bar:nth-child(5n){height:32px;margin-top:-16px;opacity:.8}.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,220,255,.22);box-shadow:inset 0 0 15px rgba(0,200,255,.04),0 0 12px rgba(0,200,255,.04)}.r1{width:91%;height:91%;border-style:dashed;animation:rot 24s linear infinite}.r2{width:78%;height:78%;border-left-color:var(--cyan);border-right-color:var(--cyan);animation:rot2 17s linear infinite}.r3{width:65%;height:65%;border-style:dashed;animation:rot 31s linear infinite}.r4{width:52%;height:52%;border-top-color:var(--cyan);border-bottom-color:var(--cyan);animation:rot2 13s linear infinite}.r5{width:40%;height:40%;border:2px solid rgba(0,234,255,.32);animation:breath 2.8s ease-in-out infinite}.orbit{position:absolute;width:84%;height:27%;border:1px solid rgba(0,234,255,.23);border-radius:50%;transform:rotate(28deg);animation:orbit 14s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan)}.orbit:before{left:9%;top:48%}.orbit:after{right:9%;top:48%}.orbit2{width:74%;height:23%;transform:rotate(-55deg);animation-duration:19s;animation-direction:reverse;border-color:rgba(0,140,255,.25)}.center{position:absolute;width:28%;height:28%;border-radius:50%;display:flex;align-items:center;justify-content:center}.glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(220,255,255,.95),rgba(0,234,255,.72) 5%,rgba(0,130,255,.24) 22%,transparent 70%);filter:blur(1px);box-shadow:0 0 25px rgba(0,234,255,.8),0 0 70px rgba(0,150,255,.4);animation:pulse 2.2s ease-in-out infinite}.coreDot{position:absolute;width:22%;height:22%;border-radius:50%;background:#dfffff;box-shadow:0 0 8px #fff,0 0 22px var(--cyan),0 0 45px var(--cyan)}.label{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:11px;letter-spacing:5px;text-shadow:0 0 8px var(--cyan)}.hint{margin-top:7px;font-size:9px;letter-spacing:3px;color:rgba(120,190,220,.5)}.panel{width:100%;max-width:1050px;background:linear-gradient(145deg,rgba(4,20,38,.82),rgba(1,9,18,.75));border:1px solid rgba(0,190,255,.23);border-radius:10px;padding:13px;box-shadow:inset 0 0 25px rgba(0,160,255,.025);text-align:center}.panelTitle{font-size:10px;letter-spacing:2.5px;color:#9ddff0}.note{margin-top:8px;font-size:11px;color:rgba(140,220,255,.65)}@keyframes rot{to{transform:rotate(360deg)}}@keyframes rot2{to{transform:rotate(-360deg)}}@keyframes orbit{to{transform:rotate(388deg)}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.72}50%{transform:scale(1.12);opacity:1}}@keyframes breath{0%,100%{transform:scale(.97);opacity:.55}50%{transform:scale(1.04);opacity:1}}@media(max-width:600px){body{padding:7px}.logo{font-size:25px;letter-spacing:8px}.coreZone{width:96vw;height:96vw}}
</style>
</head>
<body><div class="app"><header class="header"><div class="logo">JARVIS</div><div class="subtitle">HOME ASSISTANT VOICE INTERFACE</div><div class="status"><span class="dot"></span><span>HUD TEST — HORS CONNEXION</span></div></header><section class="coreZone"><div class="core"><div class="sweep"></div><div class="bars" id="bars"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="ring r5"></div><div class="orbit"></div><div class="orbit orbit2"></div><div class="center"><div class="glow"></div><div class="coreDot"></div></div><div class="label">OPÉRATIONNEL<div class="hint">HUD 72 LED — BASE VISUELLE</div></div></div></section><section class="panel"><div class="panelTitle">JARVIS CORE 2</div><div class="note">Étape 1 : reconstruction visuelle. Home Assistant sera connecté après validation du HUD.</div></section></div><script>const b=document.getElementById('bars');for(let i=0;i<72;i++){const x=document.createElement('div');x.className='bar';const a=360/72*i;const r=Math.min(b.clientWidth,b.clientHeight)/2-42;x.style.transform=`rotate(${a}deg) translateY(-${r}px)`;x.style.animationDelay=`${(i%12)*-.08}s`;b.appendChild(x)}window.addEventListener('resize',()=>{const r=Math.min(b.clientWidth,b.clientHeight)/2-42;[...b.children].forEach((x,i)=>x.style.transform=`rotate(${360/72*i}deg) translateY(-${r}px)`)});</script></body></html>
